services:
  - type: web
    name: studyai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        value: mongodb+srv://studyai:studyai123@cluster.mongodb.net/studyai
      - key: JWT_SECRET
        value: anylongrandomstring123
      - key: GROQ_API_KEY
        sync: false
      - key: CLIENT_URL
        value: https://studyai.vercel.app