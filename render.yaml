services:
  - type: web
    name: studyai-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        value: anylongrandomstring123
      - key: GROQ_API_KEY
        value: your_groq_key_here
      - key: CLIENT_URL
        value: https://studyai.vercel.app
      - key: MONGODB_URI
        value: mongodb://localhost/studyai